<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="auth-container">

    <h1 class="auth-title">Вход</h1>

    <div class="error-message"
         th:if="${param.error}">
        Неверный email или пароль
    </div>

    <div class="error-message"
         th:if="${param.logout}">
        Вы вышли из аккаунта
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="email">
                Email
            </label>

            <input
                    id="email"
                    type="email"
                    name="username"
                    required>
        </div>

        <div class="form-group">
            <label for="password">
                Пароль
            </label>

            <input
                    id="password"
                    type="password"
                    name="password"
                    required>
        </div>

        <button
                type="submit"
                class="auth-button">
            Войти
        </button>

    </form>

    <div class="auth-footer">
        Нет аккаунта?
        <a href="/registration">
            Зарегистрироваться
        </a>
    </div>

</div>

</body>
</html>
