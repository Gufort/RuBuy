<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="auth-container">

    <h1 class="auth-title">
        Регистрация
    </h1>

    <form th:action="@{/registration}"
          method="post">

        <div class="form-group">
            <label for="name">
                Имя
            </label>

            <input
                    id="name"
                    type="text"
                    name="name"
                    required>
        </div>

        <div class="form-group">
            <label for="email">
                Email
            </label>

            <input
                    id="email"
                    type="email"
                    name="email"
                    required>
        </div>

        <div class="form-group">
            <label for="password">
                Пароль
            </label>

            <input
                    id="password"
                    type="password"
                    name="password"
                    required>
        </div>

        <button
                type="submit"
                class="auth-button">
            Зарегистрироваться
        </button>

    </form>

    <div class="auth-footer">
        Уже есть аккаунт?
        <a href="/login">
            Войти
        </a>
    </div>

</div>

</body>
</html>
