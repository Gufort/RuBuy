name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: simple_spring
          POSTGRES_USER: spring_user
          POSTGRES_PASSWORD: spring_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spring_user -d simple_spring"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run tests
        run: ./mvnw test